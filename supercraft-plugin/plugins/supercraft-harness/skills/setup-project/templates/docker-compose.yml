# Generated by supercraft-harness:setup-project. Values come from .env next to this file.
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: ${COMPOSE_PROJECT_NAME}_wordpress
    restart: always
    depends_on:
      - db
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./apache-limits.conf:/etc/apache2/conf-enabled/z-limits.conf:ro
      - ./wp-uploads:/var/www/html/wp-content/uploads
      - ${ELEMENTOR_DIR}:/var/www/html/wp-content/plugins/elementor
      - ${PRO_ELEMENTS_DIR}:/var/www/html/wp-content/plugins/pro-elements
      - ${SUPERCOMPONENT_DIR}:/var/www/html/wp-content/plugins/supercomponent-studio
      - ${ANIMATION_DIR}:/var/www/html/wp-content/plugins/supercraft-animation-plugin
      - ${MASTER_DIR}:/var/www/html/wp-content/plugins/supercraft-master-plugin
      - ${NOVAMIRA_DIR}:/var/www/html/wp-content/plugins/novamira
      - ${NOVAMIRA_PRO_DIR}:/var/www/html/wp-content/plugins/novamira-pro
      - ${HELLO_THEME_DIR}:/var/www/html/wp-content/themes/hello-elementor

volumes:
  db_data:
  wordpress_data:
